  models.ProjectMemberWithRole:
    properties:
      id:
        type: integer
      project_id:
        type: integer
      role_description:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
      user_email:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
