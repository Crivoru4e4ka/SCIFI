<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scifi — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6fb;
            color: #172b4d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            width: 100%;
            max-width: 520px;
            border-radius: 1rem;
            border: 1px solid #e4e7eb;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            background-color: #ffffff;
        }
        .auth-header {
            border-bottom: 1px solid #e9eef4;
        }
        .brand-title {
            font-weight: 700;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>
    <div id="authApp" class="auth-card">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 auth-header pb-3">
                <div>
                    <div class="brand-title h4 mb-1">Scifi</div>
                    <div class="text-muted small">Войдите в аккаунт, чтобы продолжить</div>
                </div>
                <div class="text-end">
                    <div class="badge bg-primary bg-opacity-10 text-primary">Научные проекты</div>
                </div>
            </div>

            <ul class="nav nav-tabs mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">Вход</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="false">Регистрация</button>
                </li>
            </ul>
            <div class="tab-content" id="authTabContent">
                <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                    <form id="loginForm" class="row g-3" @submit.prevent="submitLogin">
                        <div class="col-12">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required v-model="login.email">
                        </div>
                        <div class="col-12">
                            <label for="loginPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Введите пароль" required v-model="login.password">
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary">Войти</button>
                        </div>
                    </form>
                </div>
                <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                    <form id="registerForm" class="row g-3" @submit.prevent="submitRegister">
                        <div class="col-12">
                            <label for="registerEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="registerEmail" placeholder="name@example.com" required v-model="register.email">
                        </div>
                        <div class="col-12">
                            <label for="registerFullName" class="form-label">Полное имя</label>
                            <input type="text" class="form-control" id="registerFullName" placeholder="Иван Иванов Иванович" required v-model="register.full_name">
                        </div>
                        <!-- Поле выбора роли -->
                        <div class="col-12">
                            <label for="registerRole" class="form-label">Ваша роль в системе</label>
                            <select class="form-select" id="registerRole" v-model="register.role" required>
                                <option value="admin">Администратор</option>
                                <option value="user">Пользователь</option>
                                <option value="guest">Гость</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="registerPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="registerPassword" placeholder="Придумайте пароль" required v-model="register.password">
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        // Как только страница загрузилась, проверяем, нет ли уже активной сессии
async function checkExistingSession() {
    try {
        const response = await fetch('/me');
        if (response.ok) {
            // Если сервер ответил 200 OK, значит мы уже залогинены
            window.location.replace('/'); // Используем replace, чтобы нельзя было нажать "назад"
        }
    } catch (e) {
        // Если ошибка — значит мы не авторизованы, остаемся на странице логина
    }
}
checkExistingSession();
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    login: {
                        email: "",
                        password: ""
                    },
                    register: {
                        email: "",
                        full_name: "",
                        role: "user",
                        password: ""
                    }
                };
            },
            methods: {
                async submitLogin() {
                    try {
                        const response = await fetch('/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.login)
                        });
                        if (response.ok) {
                            window.location.href = '/';
                        } else {
                            const error = await response.text();
                            alert('Ошибка: ' + error);
                        }
                    } catch (err) {
                        alert('Ошибка сети: ' + err.message);
                    }
                },
                async submitRegister() {
                    try {
                        const response = await fetch('/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.register)
                        });
                        if (response.ok) {
                            alert('Регистрация прошла успешно. Войдите в систему.');
                            const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
                            loginTab.show();
                            this.register = { email: "", full_name: "", role: "user", password: "" };
                        } else {
                            const error = await response.text();
                            alert('Ошибка: ' + error);
                        }
                    } catch (err) {
                        alert('Ошибка сети: ' + err.message);
                    }
                }
            }
        }).mount('#authApp');
    </script>
</body>
</html>
