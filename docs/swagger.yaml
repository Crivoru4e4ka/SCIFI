  models.ProjectGrantFunding:
    properties:
      allocated_amount:
        type: number
      created_at:
        type: string
      funding_end_date:
        type: string
      funding_purpose:
        type: string
      funding_start_date:
        type: string
      grant_id:
        type: integer
      id:
        type: integer
      notes:
        type: string
      project_id:
        type: integer
      section_id:
        type: integer
    type: object
  models.ProjectGrantInfo:
    properties:
      allocated_amount:
        type: number
      created_at:
        type: string
      funding_end_date:
        type: string
      funding_purpose:
        type: string
      funding_start_date:
        type: string
      grant_code:
        type: string
      grant_id:
        type: integer
      grant_title:
        type: string
      id:
        type: integer
      notes:
        type: string
