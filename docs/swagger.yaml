  models.Role:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      name:
        type: string
    type: object
  models.Sprint:
    properties:
      end_date:
        type: string
      goal:
        type: string
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      start_date:
        description: используем указатель, так как может быть null
        type: string
      status:
        type: string
    type: object
  models.Task:
    properties:
      assignee_id:
