  models.Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      entity_id:
        type: integer
      entity_type:
        description: '"task" или "project"'
        type: string
      id:
        type: integer
      parent_id:
        type: integer
      replies:
        items:
          type: object
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  models.Grant:
    properties:
      application_deadline:
        type: string
      code:
        type: string
      country:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      currency:
        type: string
      description:
        type: string
      end_date:
        type: string
      funding_organization:
        type: string
      grant_type:
        type: string
      id:
        type: integer
      principal_investigator_id:
        type: integer
      scientific_direction:
        type: string
      start_date:
        type: string
      status:
        type: string
      title:
        type: string
      total_amount:
        type: number
      updated_at:
        type: string
    type: object
  models.Hypothesis:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  models.Permission:
    properties:
      category:
        type: string
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.Project:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      end_date:
        type: string
      execution_type:
        type: string
      expected_result:
        description: РЕЗУЛЬТАТ
        type: string
      id:
        type: integer
      key:
        type: string
      main_hypothesis:
        description: ГИПОТЕЗА
        type: string
      name:
        type: string
      novelty:
        description: НОВИЗНА
        type: string
      research_goal:
        description: ЦЕЛЬ
        type: string
      start_date:
        type: string
      status:
        type: string
      team_id:
        type: integer
      visibility:
        description: ВИДИМОСТЬ
